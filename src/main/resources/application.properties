# ---------- Local MySQL Config (for future) ----------
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/book-store?autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# ---------- Common Connection Pool ----------
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=20
spring.datasource.tomcat.min-idle=15

spring.jpa.properties.hibernate.id.new_generator_mappings=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.devtools.restart.enabled=false

spring.jpa.hibernate.ddl-auto=update



# ---------- Swagger Info ----------
swagger.title=New Idea
swagger.description=Project
swagger.version=1.0
swagger.contact.name=any name
swagger.contact.url=
swagger.contact.email=ygr@gm.com
